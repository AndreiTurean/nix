name: CMake Linux Matrix CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install lint tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes clang clang-tidy ninja-build

    - name: Configure lint build
      env:
        CC: clang
        CXX: clang++
      run: cmake --preset lint

    - name: Run clang-tidy and build
      run: cmake --build --preset lint

  python-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: python3 -m pip install .

    - name: Build C++ interop test peer
      run: |
        cmake --preset default
        cmake --build --preset default --target nix-daemon python_interop_peer

    - name: Test portable frame compatibility
      run: python3 -m unittest discover -s tests -p 'test_python_serialized_message.py'

    - name: Test Python IPC interoperability
      env:
        NIX_TEST_DAEMON: ${{ github.workspace }}/build/default/nix/bin/nix-daemon
        NIX_TEST_CPP_PEER: ${{ github.workspace }}/build/default/nix/bin/python_interop_peer
      run: python3 -m unittest discover -s tests -p 'test_python_ipc.py'

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            preset: release
          - name: Clang Release
            cc: clang
            cxx: clang++
            preset: release
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: default
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: default

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      working-directory: ${{ github.workspace }}/build/${{ matrix.preset }}
      run: ctest --output-on-failure
