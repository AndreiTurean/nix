name: CMake Linux Matrix CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  python-interop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install package
      run: python -m pip install .

    - name: Test portable frame compatibility
      run: python -m unittest discover -s tests -p 'test_python_serialized_message.py'

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            preset: release
          - name: Clang Release
            cc: clang
            cxx: clang++
            preset: release
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: default
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: default

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      working-directory: ${{ github.workspace }}/build/${{ matrix.preset }}
      run: ctest --output-on-failure
